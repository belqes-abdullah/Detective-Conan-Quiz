<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Conan World</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== HEADER ==================== --> 
    <header>
        <img src="assets/Logo.png" alt="Logo" id="logo" class="mouse">
        <h1 class="mouse">Detective Conan Quiz</h1>
        <nav>
            <ul>
                <li><a href="#questions"><b>Questions</b></a></li>
                <li><a href="#about"><b>About</b></a></li>
            </ul>
        </nav>
    </header>

    <!-- ==================== CONTENT ==================== -->
    <section id="questions">
        <div class="question">
            <h2>Question 1</h2>
            <p><b>What is the real name of Detective Conan?</b></p>
            <img src="assets/Question1.jpg" alt="Detective Conan" style="width:200px; border-radius: 10px;">
            <form class="input-container">
                <label for="answer1" class="label"><b>Your Answer:</b></label> <br>
                <input type="text" id="answer1" placeholder="Type your answer here">
                <button type="button" onclick="checkAnswer('answer1')">Check</button>
            </form>
        </div>
        <!-- Add more questions as needed -->
    </section>

    <!-- ==================== FOOTER ==================== -->
    <footer>
        <img src="assets/Footer.png" alt="pictures" id="Flogo">
        <p class="mouse">&copy; 2024 Detective Conan Fan</p>
    </footer> 

    <script src="js/main.js"></script>
</body>
</html>
